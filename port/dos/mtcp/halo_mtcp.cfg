/*
   HALO_MTCP.CFG

   The configuration of mTCP (global.cfg's options) for Halo's DOS build:
   the game's system link play (port/dos/dos/dos_net.cpp) is a host of up to
   sixteen machines over TCP streams and UDP datagrams, so many more
   sockets, buffers and UDP ports than mTCP's own applications use. Built
   for 32-bit protected mode (halo_mtcp.h).
*/

#ifndef GLOBAL_CFG_H
#define GLOBAL_CFG_H

#define MTCP_PROGRAM_NAME "halo"
#define COMPILE_ARP

#define PACKET_HANDLERS      (2)   // Number of etherType handlers
#define PACKET_BUFFERS      (40)   // Number of incoming buffers
#define PACKET_BUFFER_LEN (1514)   // Size of each incoming buffer
#define PKT_DUMP_BYTES    (1514)   // Maximum number of bytes for packet dumps

#define ARP_MAX_ENTRIES     (24)   // Size of ARP cache
#define ARP_MAX_PENDING      (8)   // Max number of pending requests
#define ARP_RETRIES          (3)   // Number of retries to attempt
#define ARP_TIMEOUT      (500ul)   // MS between retries
#define ARP_TIMEOUT_FAST (200ul)   // MS between retries; fast fail version

#define IP_FRAGMENTS_ON
#define IP_SEND_UDP_FRAGS
#define IP_MAX_FRAG_PACKETS              (8)  // # to reassemble concurrently
#define IP_MAX_FRAGS_PER_PACKET         (10)  // Max number of frags per pkt
#define IP_BIGPACKET_SIZE             (4096)  // Maximum IP payload size
#define IP_FRAG_REASSEMBLY_TIMEOUT  (4000ul)  // MS before giving up

#define COMPILE_ICMP
#define ICMP_ECHO_OPT_DATA       (256)   // How big can the payload be?

#define COMPILE_TCP
#define TCP_LISTEN_CODE
#define TCP_MAX_SOCKETS           (32)   // Maximum number of sockets to use
#define TCP_MAX_XMIT_BUFS         (40)   // Number of x-mit buffers to create
#define TCP_SOCKET_RING_SIZE      (16)   // Size of queues in each socket
#define TCP_CLOSE_TIMEOUT    (15000ul)   // MS before forcing a socket closed

#define COMPILE_UDP
#define UDP_MAX_CALLBACKS         (16)

#define COMPILE_DNS
#define DNS_MAX_NAME_LEN             (128)   // Seems reasonable
#define DNS_MAX_DOMAIN_LEN            (50)   // Max length for a domain name
#define DNS_MAX_ENTRIES                (8)   // 7 bits only (max 127)
#define DNS_HANDLER_PORT            (1057)   // Choose something stable to avoid conflicts.
#define DNS_RECURSION_DESIRED          (1)   // Yes - let the server do the work
#define DNS_INITIAL_SEND_TIMEOUT   (500ul)   // ARP timeout for first try
#define DNS_RETRY_THRESHOLD       (2000ul)   // Retry a request after 2000 ms
#define DNS_TIMEOUT              (10000ul)   // 10000 ms

#define DHCP_LEASE_THRESHOLD      (3600ul)

// (no trace points: the game has its own log)
#define NOTRACE

#endif
